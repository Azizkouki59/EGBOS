claim_id: CLAIM-L3-05
namespace: engine
title: L5 startup buffer empirically sized (pre-live, synthetic feeds)
owner: founder
status: active
verification_class: V3
description: startup.buffer
text: >
  The L5 Execution Router startup buffer (egbos_exec_commands SPSC ring, 4096
  slots × 64B per Blueprint §C3.1) is sized based on empirical measurement
  under synthetic feed conditions. The ExecutionRouter::commands_consumed()
  counter provides runtime evidence of buffer utilization during the 60s
  staging smoke test. P99 command throughput confirmed within 20% of
  timing_constants.json baseline. V4 upgrade requires live feed jitter
  measurement (S5 entry condition).
class_rationale: >
  V3: Structural correctness (SPSC ring size is a compile-time constant per
  AD-006; ring slots = 4096 per Blueprint §C3.1) + synthetic-feed sizing
  confirmed by 60s simulator smoke test. No live feed jitter measurement yet
  (that is an S5 entry criterion). Buffer sizing is pre-live and empirically
  derived from synthetic workloads. V4 requires live exchange feed data (S5).
enforcement_mechanism: compile-time constant (AD-006 static_assert in shm_layout.h)
enforcement_scope: engine/core/shm_layout.h, engine/core/execution_router.h
enforcement_gaps:
  - Live feed jitter measurement deferred to S5 (V4 upgrade condition)
  - ONNX model inference startup latency not yet measured (pre-live)
assumptions:
  - Synthetic feed rate ≤ production peak rate (conservative sizing)
  - timing_constants.json baseline is from staging-equivalent hardware
