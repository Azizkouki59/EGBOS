schema_version: 1
claim_id: CLAIM-INV-001
namespace: engine
title: Position invariant holds across 10M fills (gross_exposure_ == Σ|signed_qty|)
owner: founder
status: active
verification_class: V4
description: exec.position
text: >
  gross_exposure_ is the monotonically-accumulated absolute quantity across all
  fills applied to the PositionEngine. After N fills, gross_exposure_ must equal
  the sum of |signed_qty| for every fill. This invariant is verified by executing
  10,000,000 alternating buy/sell fills (qty=+1/-1) and confirming gross_exposure_
  equals 10,000,000 (the sum of all absolute quantities).
class_rationale: >
  V4: Static enforcement (GC-E-043, govcheck prevents external state access) +
  dynamic proof (10M fill invariant test run to completion). The 10M test exercises
  the accumulation arithmetic exhaustively and verifies no integer overflow or
  counter reset occurs over a typical trading session workload.
enforcement_mechanism: govcheck GC-E-043 + 10M fill invariant test
enforcement_scope: engine/core/position_engine.cpp
enforcement_gaps: []
assumptions:
  - int64_t accumulation does not overflow for realistic trading session volumes
  - gross_exposure_ is only written by apply_fill and apply_mass_cancel
composition_dependencies:
  - CLAIM-L3-001
composed_verification_class: V4
