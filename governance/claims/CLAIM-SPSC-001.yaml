schema_version: 1
claim_id: "CLAIM-SPSC-001"
namespace: "ipc.spsc"
title: "Lock-free SPSC ring buffer correctness under TSAN and cache-line isolation"
text: |
  The SpscRing<T, Capacity> template implements a lock-free single-producer
  single-consumer ring buffer. Producer and consumer indices are on separate
  cache lines (64-byte aligned) to prevent false sharing. Capacity is
  enforced at compile time as a power of two (AD-006). The slot type must
  be trivially copyable and default constructible (§14.2). Memory ordering
  follows §5.2: producer reads its own head relaxed, reads tail with acquire;
  consumer reads its own tail relaxed, reads head with acquire; head store
  is seq_cst, tail store is release. Thread identity is asserted in DEBUG
  builds via atomic compare_exchange on first call; concurrent access from
  a second producer or consumer triggers assertion failure. Spin yield
  backpressure uses _mm_pause then sched_yield after kSpscSpinYieldThreshold
  iterations (§5.3). No heap allocation exists in any code path (GC-E-010).
verification_class: "V4"
previous_class: null
class_rationale: "V4 — Empirical. Requires TSAN-clean full test suite, P99 push/pop ≤ 50 ns on target hardware, and verified cache-line isolation of producer/consumer indices."
enforcement_mechanism: "tests/engine/spsc_ring_test (under TSAN profile); govcheck rule GC-E-010"
enforcement_scope: "engine/core/spsc_ring.h — SpscRing::push(), SpscRing::pop(), cache-line alignment of head_/tail_, compile-time static_asserts."
enforcement_gaps:
  - "P99 latency measurement requires target co-location hardware; dev workstation results are indicative only."
  - "TSAN cannot detect all possible memory ordering bugs — it provides high but not complete coverage."
  - "Thread identity assertion is disabled in NDEBUG builds; production relies on structural single-thread guarantee."
assumptions:
  - "Hardware cache line size is 64 bytes on target x86_64 platform."
  - "TSAN under GCC 13 / Clang 17 correctly models acquire/release/seq_cst semantics."
  - "_mm_pause intrinsic is available on target x86_64 hardware."
  - "sched_yield() is available on target Linux kernel."
