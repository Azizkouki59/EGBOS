schema_version: 1
claim_id: "CLAIM-L3-POOL-001"
namespace: "allocator.pool"
title: "Pool allocator zero-heap guarantee with ASAN verification"
text: |
  The PoolAllocator<T, N> template provides a fixed-capacity, lock-free
  object pool with zero heap allocation. All storage is member-resident
  via a stack-embedded array of N slots. Capacity and alignment are
  enforced at compile time via static_assert: N must be a power of two,
  T must be trivially destructible, and slot alignment must satisfy
  alignof(T). Acquire returns a non-null pointer from the freelist or
  nullptr on exhaustion — never allocates from the heap. Release returns
  objects to the freelist after pointer validation (bounds check against
  the pool's address range). Double-free is detected via a debug-mode
  bitset that tracks slot occupancy. ASAN runs produce zero malloc/new
  originating from pool code paths. The freelist is managed via a
  lock-free atomic stack using compare_exchange_weak with
  acquire-on-load / release-on-store ordering.
verification_class: "V2"
previous_class: null
class_rationale: "V2 — Code review evidence plus ASAN verification confirming zero malloc/new from pool paths. Not V4 because no empirical kill-9 or latency benchmark is required for the allocator itself."
enforcement_mechanism: "ASAN build profile with zero malloc/new from pool paths; govcheck rule GC-E-010"
enforcement_scope: "engine/core/pool_allocator.h — PoolAllocator::acquire(), PoolAllocator::release(), compile-time static_asserts, freelist management."
enforcement_gaps:
  - "ASAN cannot detect logic errors in freelist ordering — only memory safety violations."
  - "V2 does not require empirical latency benchmarks; allocation latency is not verified."
  - "Double-free detection bitset is debug-only; release builds rely on structural correctness."
assumptions:
  - "ASAN correctly intercepts all heap allocations (malloc, new, calloc, realloc)."
  - "Trivially destructible types do not require destructor invocation on release."
  - "Hardware supports lock-free compare_exchange on the target platform."
