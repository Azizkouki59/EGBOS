schema_version: 1
claim_id: CLAIM-L3-02
namespace: engine
title: FIX consumer contains zero business logic — pure translation layer
owner: founder
status: active
verification_class: V3
description: exec.fix_consumer
text: >
  The FIX consumer (engine/core/fix_consumer.cpp / fix_consumer.h) is a pure
  translation layer. It maps ExecCommand struct fields to FIX 4.2 wire tags with
  no control flow on command content. It performs no order evaluation, no risk
  checking, no position tracking, and makes no execution decisions. All such
  logic is exclusively in L3 (PositionEngine) and L4 (RiskEnforcer).
  Required FIX fields SessionID, MsgSeqNum, and R_applied are set by L3 before
  command is pushed to the SPSC ring (GC-E-042 compliance).
class_rationale: >
  V3: Static enforcement (GC-E-042 scanner blocks control flow in FIX consumer
  files) + source inspection confirms zero branching on command content.
  The violation fixture (violation_GC_E_042.cpp) confirms the scanner correctly
  detects business logic in FIX consumer context. No dynamic test under synthetic
  load yet (pre-live staging only); V4 upgrade deferred to S5 live qualification.
enforcement_mechanism: govcheck GC-E-042 (blocking scanner)
enforcement_scope: engine/core/fix_consumer.cpp, engine/core/fix_consumer.h
enforcement_gaps: []
assumptions:
  - All commands arriving at the FIX consumer have been risk-checked and
    WAL-committed by L3 before SPSC push
  - SessionID, MsgSeqNum, and R_applied are set by L3 (structural, not checked here)
