schema_version:                1
claim_id:                      "CLAIM-LOB-001"
namespace:                     "lob"
title:                         "Limit Order Book Determinism and Zero Allocation"
text:                          |
  L1 uses a flat array representation with O(1) lookups via int64_t fixed-point pricing.
  L1 executes without any dynamic memory allocation on the hot path.
  L1 resists fuzzed poison packets without crashing for at least 60s.
