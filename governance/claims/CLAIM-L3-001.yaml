claim_id: CLAIM-L3-001
namespace: engine
title: WAL-before-state ordering enforced across all position mutations (AD-012)
owner: founder
status: active
verification_class: V4
description: exec.wal_ordering
text: >
  Every mutation to L3 position state (apply_fill, apply_mass_cancel, sync_position)
  writes and fsync-confirms a WAL record before any in-memory state is updated.
  This is verified by 10x simulated kill-9 cycles: in each cycle the WAL file size
  is measured before and after apply_fill(), confirming the record is durable prior
  to exposure state update. AD-012 §4.6 is the governing constraint.
class_rationale: >
  V4: Static enforcement (GC-WAL-001 scanner in govcheck) + dynamic proof (10x
  kill-9 simulation). The scanner blocks any source pattern where an atomic state
  mutation precedes a WAL write in the same function scope. The kill-9 simulation
  confirms durability at runtime by inspecting file size growth.
enforcement_mechanism: govcheck GC-WAL-001 scanner + runtime kill-9 simulation test
enforcement_scope: engine/core/position_engine.cpp
enforcement_gaps: []
assumptions:
  - O_DSYNC semantics are correctly implemented by the kernel for the WAL file descriptor
  - io_uring WRITE_FIXED with O_DSYNC is equivalent to fsync for WAL durability purposes
