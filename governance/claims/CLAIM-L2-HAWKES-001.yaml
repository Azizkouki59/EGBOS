schema_version: 1
claim_id: CLAIM-L2-HAWKES-001
namespace: engine
title: Univariate self-exciting Hawkes intensity computed on L0 depth-event stream (RFC-003)
owner: founder
status: pending
verification_class: V4
description: feature.hawkes_intensity
text: >
  A univariate Hawkes process intensity is computed per-instrument from the
  existing L0 depth-event stream (RawMarketEvent, EventType in {NEW, CANCEL}),
  pooled across bid and ask sides, ordered by ingestion_tsc (CLOCK_MONOTONIC_RAW
  at WebSocket frame receipt; exchange_tsc is unavailable on the @depth feed
  and is not used). Uses an exponential excitation kernel for O(1) exact
  update cost per event, satisfying the <200us / zero-dynamic-allocation
  constitutional bound (EGBOS_MASTER.md DOM-05). Baseline intensity (mu) and
  excitation parameters (alpha, beta) are externally configured, not
  hardcoded, pending offline calibration. State resets to baseline mu on
  GapEvent, mirroring LOB reset semantics. Numerical overflow of accumulated
  intensity returns an explicit INVALID status rather than silently clamping.
class_rationale: >
  V4: Static enforcement (existing GC-E-054 / Clang AST no-malloc scanner
  applies unchanged to this code path) + dynamic proof via unit tests
  covering empty state, single/multiple events, equal timestamps, tiny/large
  delta-t, warmup, reset-on-gap, and deterministic replay, plus DIRC
  cross-language byte-identical comparison against an offline Python
  reference implementation once one exists.
enforcement_mechanism: govcheck GC-E-054 no-malloc scanner + engine/tests/test_hawkes_intensity.cpp + DIRC byte-identical replay comparison (offline reference not yet implemented)
enforcement_scope: engine/l2/feature_engine.cpp
enforcement_gaps:
  - "No offline (Python/Polars) reference implementation exists yet; DIRC byte-identical cross-language check (per EGBOS_MASTER.md L3B.1) cannot be run until one is written. This claim must not be marked verified/certified until that comparison passes."
  - "Baseline mu / excitation alpha,beta have no calibrated values; initial values are placeholders pending offline research, tracked as an open parameter in RFC-003."
  - "Feature has not yet been assigned a feature_id or FeatureVector payload offset; both are TBD at implementation time and must be recorded here once assigned."
assumptions:
  - "ingestion_tsc is monotonically non-decreasing across events for a given instrument (holds because it is captured in-process at frame receipt, per binance_feed_listener.h)."
  - "Depth-event arrivals are an acceptable proxy for the point process being modeled; this is an explicit scope decision recorded in RFC-003, not an assumption that the depth stream equals trade arrival intensity."
