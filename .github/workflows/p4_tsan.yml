# .github/workflows/p4_tsan.yml
# P4 Gate: ThreadSanitizer test suite (PR-blocking)
# Spec: §I2 S1 exit, §10 P4 gate definition
# Scope: P4
# Triggers: Every pull request and push to main
# Note: TSAN uses Clang as required by spec (GCC TSAN has false positives with atomics)

name: P4 Gate - TSAN Thread Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  p4-tsan-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Compiler & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 clang++-17 cmake libssl-dev

      - name: "P4: Build — TSAN (Clang-17 Debug)"
        run: |
          cmake -B build_tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-17 \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DENABLE_TSAN=ON
          cmake --build build_tsan --target govcheck
          cmake --build build_tsan --target govcheck_tests
          cmake --build build_tsan --target pool_allocator_test
          cmake --build build_tsan --target spsc_ring_test
          cmake --build build_tsan --target wal_writer_test

      - name: "P4: Run Tests — TSAN (zero races required)"
        run: |
          cd build_tsan && ctest --output-on-failure -V
