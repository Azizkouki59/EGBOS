name: P2 Gate - Build Matrix

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            compiler_version: '13'
            build_type: Release
            asan: OFF
            tsan: OFF
            ubsan: OFF
          - compiler: gcc
            compiler_version: '13'
            build_type: Debug
            asan: ON
            tsan: OFF
            ubsan: ON
          - compiler: clang
            compiler_version: '17'
            build_type: Release
            asan: OFF
            tsan: OFF
            ubsan: OFF
          - compiler: clang
            compiler_version: '17'
            build_type: Debug
            asan: ON
            tsan: OFF
            ubsan: ON
          - compiler: clang
            compiler_version: '17'
            build_type: Debug
            asan: OFF
            tsan: ON
            ubsan: OFF

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler & dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y gcc-${{ matrix.compiler_version }} g++-${{ matrix.compiler_version }}
          else
            sudo apt-get install -y clang-${{ matrix.compiler_version }}
          fi
          sudo apt-get install -y cmake libssl-dev git

      - name: Configure CMake
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc-${{ matrix.compiler_version }}
            export CXX=g++-${{ matrix.compiler_version }}
          else
            export CC=clang-${{ matrix.compiler_version }}
            export CXX=clang++-${{ matrix.compiler_version }}
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_ASAN=${{ matrix.asan }} \
            -DENABLE_TSAN=${{ matrix.tsan }} \
            -DENABLE_UBSAN=${{ matrix.ubsan }}

      # ── P2: Build all targets explicitly ──
      - name: Build Targets
        run: |
          cmake --build build --target govcheck
          cmake --build build --target govcheck_tests
          cmake --build build --target pool_allocator_test
          cmake --build build --target spsc_ring_test
          cmake --build build --target wal_writer_test

      # ── P2: Verify binaries exist before testing ──
      - name: Verify test binaries
        run: |
          echo "Verifying govcheck test binaries..."
          test -x build/govcheck/govcheck          || { echo "FAIL: govcheck binary missing"; exit 1; }
          test -x build/govcheck/govcheck_tests     || { echo "FAIL: govcheck_tests binary missing"; exit 1; }

          echo "Verifying engine test binaries..."
          test -x build/engine/tests/pool_allocator_test || { echo "FAIL: pool_allocator_test binary missing"; exit 1; }
          test -x build/engine/tests/spsc_ring_test      || { echo "FAIL: spsc_ring_test binary missing"; exit 1; }
          test -x build/engine/tests/wal_writer_test     || { echo "FAIL: wal_writer_test binary missing"; exit 1; }

          echo "All test binaries verified."

      # ── P3: Run all unit & integration tests via CTest ──
      - name: Run Tests (P3 — Unit + Integration)
        run: |
          cd build && ctest --output-on-failure -V 2>&1 | tee /tmp/ctest_p3.log
          echo "P3 gate: all tests passed."

      # ── P5: Latency Regression (informational mode for S1) ──
      # §10 P5: P99 WAL fsync and SPSC push/pop within 10% of
      # timing_constants.json baseline. S1 baseline is a schema stub
      # (§1 line 82) — informational until populated.
      - name: P5 Latency Regression Check
        if: matrix.build_type == 'Release' && matrix.tsan == 'OFF' && matrix.asan == 'OFF'
        run: |
          TIMING_FILE="governance/proof_artifacts/timing_constants.json"

          echo "═══════════════════════════════════════════════════════════════"
          echo "  P5 Latency Regression — ${{ matrix.compiler }}-${{ matrix.compiler_version }} ${{ matrix.build_type }}"
          echo "═══════════════════════════════════════════════════════════════"

          # Run latency-specific tests and capture output
          WAL_OUTPUT=$(cd build && ./engine/tests/wal_writer_test --gtest_filter='WalWriterTest.FsyncLatency' 2>&1) || true
          SPSC_OUTPUT=$(cd build && ./engine/tests/spsc_ring_test --gtest_filter='SpscRingTest.LatencyP99' 2>&1) || true

          echo "$WAL_OUTPUT"
          echo "$SPSC_OUTPUT"

          # Extract measured P99 values from test output
          WAL_P99=$(echo "$WAL_OUTPUT" | grep -oP 'WAL fsync P99:\s+\K\d+' || echo "0")
          SPSC_P99=$(echo "$SPSC_OUTPUT" | grep -oP 'SPSC P99 latency:\s+\K\d+' || echo "0")

          echo ""
          echo "Measured values:"
          echo "  WAL fsync P99:      ${WAL_P99} ns"
          echo "  SPSC push/pop P99:  ${SPSC_P99} ns"

          # Read baseline from timing_constants.json
          BASELINE_WAL_P99=$(python3 -c "import json; d=json.load(open('${TIMING_FILE}')); print(d['measurements']['wal_fsync_p99_ns'])")
          BASELINE_SPSC_P99=$(python3 -c "import json; d=json.load(open('${TIMING_FILE}')); print(d['measurements']['spsc_push_pop_p99_ns'])")

          echo "  Baseline WAL P99:   ${BASELINE_WAL_P99} ns"
          echo "  Baseline SPSC P99:  ${BASELINE_SPSC_P99} ns"

          # Check if baseline is populated (non-zero)
          if [ "$BASELINE_WAL_P99" -eq 0 ] && [ "$BASELINE_SPSC_P99" -eq 0 ]; then
            echo ""
            echo "P5: INFORMATIONAL — baseline not yet established."
            echo "    timing_constants.json contains zero values (S1 schema stub)."
            echo "    Latency measurements captured but regression check skipped."
            echo "    Populate timing_constants.json with measured values to activate P5 enforcement."

            # Write measured values to artifact for baseline establishment
            mkdir -p /tmp/p5_artifacts
            cat > /tmp/p5_artifacts/latency_report.json << LATEOF
          {
            "gate": "P5",
            "mode": "informational",
            "compiler": "${{ matrix.compiler }}-${{ matrix.compiler_version }}",
            "build_type": "${{ matrix.build_type }}",
            "measured": {
              "wal_fsync_p99_ns": ${WAL_P99},
              "spsc_push_pop_p99_ns": ${SPSC_P99}
            },
            "baseline": {
              "wal_fsync_p99_ns": ${BASELINE_WAL_P99},
              "spsc_push_pop_p99_ns": ${BASELINE_SPSC_P99}
            },
            "verdict": "INFORMATIONAL_BASELINE_NOT_ESTABLISHED"
          }
          LATEOF
          else
            echo ""
            echo "P5: ENFORCEMENT — baseline is populated. Checking 10% regression threshold."

            # §10 P5: "within 10% of timing_constants.json P99 baseline"
            FAIL=0

            if [ "$BASELINE_WAL_P99" -gt 0 ]; then
              THRESHOLD_WAL=$(python3 -c "print(int(${BASELINE_WAL_P99} * 1.10))")
              echo "  WAL threshold (110%): ${THRESHOLD_WAL} ns"
              if [ "$WAL_P99" -gt "$THRESHOLD_WAL" ]; then
                echo "  FAIL: WAL fsync P99 ${WAL_P99} ns exceeds threshold ${THRESHOLD_WAL} ns"
                FAIL=1
              else
                echo "  PASS: WAL fsync P99 ${WAL_P99} ns within threshold"
              fi
            fi

            if [ "$BASELINE_SPSC_P99" -gt 0 ]; then
              THRESHOLD_SPSC=$(python3 -c "print(int(${BASELINE_SPSC_P99} * 1.10))")
              echo "  SPSC threshold (110%): ${THRESHOLD_SPSC} ns"
              if [ "$SPSC_P99" -gt "$THRESHOLD_SPSC" ]; then
                echo "  FAIL: SPSC P99 ${SPSC_P99} ns exceeds threshold ${THRESHOLD_SPSC} ns"
                FAIL=1
              else
                echo "  PASS: SPSC P99 ${SPSC_P99} ns within threshold"
              fi
            fi

            mkdir -p /tmp/p5_artifacts
            cat > /tmp/p5_artifacts/latency_report.json << LATEOF
          {
            "gate": "P5",
            "mode": "enforcement",
            "compiler": "${{ matrix.compiler }}-${{ matrix.compiler_version }}",
            "build_type": "${{ matrix.build_type }}",
            "measured": {
              "wal_fsync_p99_ns": ${WAL_P99},
              "spsc_push_pop_p99_ns": ${SPSC_P99}
            },
            "baseline": {
              "wal_fsync_p99_ns": ${BASELINE_WAL_P99},
              "spsc_push_pop_p99_ns": ${BASELINE_SPSC_P99}
            },
            "verdict": "$(if [ $FAIL -eq 0 ]; then echo 'PASS'; else echo 'FAIL'; fi)"
          }
          LATEOF

            if [ "$FAIL" -eq 1 ]; then
              echo ""
              echo "P5: FAIL — latency regression detected."
              exit 1
            else
              echo ""
              echo "P5: PASS — all measurements within 10% of baseline."
            fi
          fi

      - name: Upload P5 latency report
        if: matrix.build_type == 'Release' && matrix.tsan == 'OFF' && matrix.asan == 'OFF'
        uses: actions/upload-artifact@v4
        with:
          name: p5-latency-report-${{ matrix.compiler }}-${{ matrix.compiler_version }}
          path: /tmp/p5_artifacts/
